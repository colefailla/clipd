name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned; Dependabot maintains the commit references.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ["1.24", "stable"]

    runs-on: ${{ matrix.os }}
    name: test (${{ matrix.os }}, go ${{ matrix.go }})

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go }}

      - name: Install test tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y netcat-openbsd socat dash zsh openssh-server
          sudo mkdir -p /run/sshd

      - name: Install test tools (macOS)
        if: runner.os == 'macOS'
        run: brew install socat dash

      - name: Require shell and transport coverage
        run: |
          for tool in sh dash bash zsh nc socat ssh sshd ssh-keygen tar; do
            command -v "$tool" || exit 1
          done

      - name: Check formatting
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            gofmt -s -d .
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Vet (linux target)
        run: GOOS=linux GOARCH=amd64 go vet ./...

      - name: Test
        env:
          CLIPD_TEST_SSHD: "1"
        run: go test -race ./...

  vulncheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  cross-compile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable

      - name: Build every release target
        run: make dist

      - name: Confirm the Linux binaries are static
        run: |
          for f in dist/clipd_linux_*; do
            if ! file "$f" | grep -q "statically linked"; then
              echo "$f is dynamically linked"; file "$f"; exit 1
            fi
            echo "ok: $f"
          done
