name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

# Actions are pinned; Dependabot maintains the commit references.
jobs:
  test:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable

      - name: Install test tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y netcat-openbsd socat dash zsh openssh-server
          sudo mkdir -p /run/sshd

      - name: Install test tools (macOS)
        if: runner.os == 'macOS'
        run: brew install socat dash

      - name: Require shell and transport coverage
        run: |
          for tool in sh dash bash zsh nc socat ssh sshd ssh-keygen tar; do
            command -v "$tool" || exit 1
          done

      - name: Test
        env:
          CLIPD_TEST_SSHD: "1"
        run: go test -race ./...

      - name: govulncheck
        if: matrix.os == 'ubuntu-latest'
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  release:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Version metadata comes from git describe.
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable

      - name: Build
        run: make dist

      - name: Checksums
        working-directory: dist
        run: sha256sum clipd_* > SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/clipd_*

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME}"
          gh release create "$version" \
            --title "clipd $version" \
            --generate-notes \
            dist/clipd_darwin_arm64 \
            dist/clipd_darwin_amd64 \
            dist/clipd_linux_amd64 \
            dist/clipd_linux_arm64 \
            dist/SHA256SUMS
